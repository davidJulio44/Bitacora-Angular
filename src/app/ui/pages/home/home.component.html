<div class="container">

  <h1>Mis tareas</h1>

  <!-- Formulario -->
  <app-task-form
    (agregar)="agregarTarea($event)">
  </app-task-form>


  <!-- Lista de tareas -->
  <app-task-list
    [tareas]="taskService.getTareas()"
    (toggle)="toggleTarea($event)"
    (eliminar)="eliminarTarea($event)">
  </app-task-list>

</div>
